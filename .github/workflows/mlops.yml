name: MLOps — Train and Publish Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training-random-check/**'

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build training service
        working-directory: training-random-check
        run: mvn package -DskipTests -Dquarkus.package.jar.type=uber-jar

      - name: Generate sample training data
        run: |
          python3 - > random-data.csv <<'EOF'
          import random, csv, sys
          from datetime import datetime

          urls = [
              'http://python-random:5000/random',
              'http://golang-random:8081/random',
              'http://js-random:8083/random',
          ]
          writer = csv.writer(sys.stdout)
          writer.writerow(['datetime', 'attempt', 'url', 'status', 'body', 'zscore'])
          for i in range(100):
              for url in urls:
                  dt = datetime.now().strftime('%Y/%m/%d %H:%M:%S')
                  writer.writerow([dt, i + 1, url, 200, random.randint(1, 100), 'no_model'])
          EOF

      - name: Train model
        run: |
          python3 - > random-model.json <<'EOF'
          import csv, json, math
          from datetime import datetime, timezone

          def compute_stats(values):
              n = len(values)
              mean = sum(values) / n
              std = math.sqrt(sum((v - mean) ** 2 for v in values) / n)
              return {
                  "count": n,
                  "mean": round(mean, 4),
                  "stdDev": round(std, 4),
                  "min": min(values),
                  "max": max(values),
              }

          data = {}
          with open('random-data.csv') as f:
              for row in csv.DictReader(f):
                  if row['status'] != '200':
                      continue
                  try:
                      data.setdefault(row['url'], []).append(float(row['body']))
                  except ValueError:
                      pass

          model = {
              "version": "1.0",
              "trainedAt": datetime.now(timezone.utc).isoformat(),
              "totalSamples": sum(len(v) for v in data.values()),
              "sources": {url: compute_stats(vals) for url, vals in data.items()},
          }
          print(json.dumps(model, indent=2))
          EOF

      - name: Upload training data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-data-${{ github.run_number }}
          path: random-data.csv
          retention-days: 30

      - name: Publish model to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="model-$(date +'%Y%m%d%H%M%S')-${{ github.run_number }}"
          gh release create "$TAG" random-model.json \
            --title "Model $TAG" \
            --notes "Trained on commit ${{ github.sha }} by run #${{ github.run_number }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push training service image
        uses: docker/build-push-action@v6
        with:
          context: training-random-check
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/mlops-training-random-check:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/mlops-training-random-check:${{ github.sha }}
